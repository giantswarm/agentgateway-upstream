# Fork (giantswarm/agentgateway-upstream): keeps the Giant Swarm line of
# agentgateway in step with upstream (FORK.md, "Re-pin"). Weekly and on demand it
#   1. mirrors upstream `main` into this fork's `main` (fast-forward; a mirror
#      that is not an ancestor of upstream was edited and stops the run) and
#      cancels the workflow runs upstream's own workflow files start on the
#      mirrored ref (they ask for runners the fork does not have);
#   2. probes whether the carried patches of the `giantswarm` branch still
#      rebase onto upstream `main` and names the first one that would conflict;
#   3. on `workflow_dispatch` with a `pin`, builds a re-pin candidate: rebases
#      the carried patches onto the upstream tag (a patch upstream has merged
#      falls away), builds the controller as a smoke, pushes the candidate to
#      `sync/<date>-<pin>` — whose push runs the line's required checks on it
#      (pull_request.yml) — and opens a pull request against the line; when a
#      patch conflicts, the candidate holds what applied before it and the pull
#      request names the rest, to be finished by hand on the same branch; the
#      new candidate supersedes every other `sync/*` branch: their pull
#      requests are closed and the branches deleted;
#   4. on `workflow_dispatch` with `land`, lands a candidate: once the line's
#      required checks passed on the candidate's head and the line is still at
#      the head the candidate was replayed from, pushes exactly that commit to
#      the line with the lease on that head, closes the pull request and
#      deletes the candidate branch. A re-pin rewrites the line, so no merge
#      method of the pull request can land it; the gate is the required checks
#      on the pushed commit, which the line's ruleset enforces for every actor.
# Pushes are made as the org's HeraldBot GitHub App (a token minted per run
# from the org secrets HERALD_CLIENT_ID / HERALD_APP_KEY; the App is installed
# on every org repository with contents and workflows write access and is a
# bypass actor of the rulesets on `main` and `giantswarm`): a push with
# GITHUB_TOKEN triggers no other workflow — and the candidate's push is what
# runs the required checks on it, the line's push what publishes the dev build
# — while a classic personal access token without the `workflow` scope cannot
# push commits that touch .github/workflows, which every mirror and re-pin does.
name: sync-upstream

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      pin:
        description: "Upstream release tag (or commit) to re-pin the giantswarm branch onto, e.g. v1.6.0: pushes a candidate and opens its pull request. Empty: mirror main and probe the rebase only."
        required: false
      land:
        description: "A candidate branch (sync/<date>-<pin>) to land on giantswarm once its required checks passed"
        required: false
      dry_run:
        description: "Do everything except push"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  LINE_BRANCH: giantswarm
  UPSTREAM_REPO: agentgateway/agentgateway
  # The checks the line's ruleset requires on every update of the line.
  REQUIRED_CHECKS: ci-ok

jobs:
  sync:
    if: inputs.land == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Mint the bot token
        id: app
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.HERALD_CLIENT_ID }}
          private-key: ${{ secrets.HERALD_APP_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.LINE_BRANCH }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch upstream
        run: |
          set -o errexit -o nounset -o pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --quiet upstream main 'refs/tags/v*:refs/tags/v*'
          git config user.name "HeraldBot[bot]"
          git config user.email "149080493+heraldbot[bot]@users.noreply.github.com"

      - name: Mirror upstream main
        id: mirror
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o errexit -o nounset -o pipefail
          fork=$(git rev-parse origin/main)
          up=$(git rev-parse upstream/main)
          if [ "${fork}" = "${up}" ]; then
            echo "- main: at upstream \`${up:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor "${fork}" "${up}"; then
            echo "::error::origin/main ${fork:0:12} is not an ancestor of upstream/main ${up:0:12} — the mirror was edited or upstream rewrote its main; restore it by hand (FORK.md, 'Branches')"
            exit 1
          fi
          echo "- main: \`${fork:0:12}\` → \`${up:0:12}\` (fast-forward)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_RUN}" != true ]; then
            echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            git push --force-with-lease="refs/heads/main:${fork}" origin "${up}:refs/heads/main"
          fi

      - name: Cancel the runs upstream's workflow files start on the mirrored ref
        if: steps.mirror.outputs.since != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.mirror.outputs.since }}
        run: |
          set -o errexit -o nounset -o pipefail
          declare -A done=()
          deadline=$((SECONDS + 90))
          while :; do
            while read -r id name; do
              [ -n "${id}" ] && [ -z "${done[$id]:-}" ] || continue
              if gh run cancel "${id}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
                done[$id]=1
                echo "cancelled run ${id}: ${name} on main"
              fi
            done < <(gh run list --repo "${GITHUB_REPOSITORY}" --branch main --event push --created ">=${SINCE}" --limit 50 \
              --json databaseId,workflowName,status --jq '.[] | select(.status != "completed") | "\(.databaseId) \(.workflowName)"')
            [ "${SECONDS}" -gt "${deadline}" ] && break
            sleep 15
          done
          echo "- cancelled ${#done[@]} run(s) started by the mirror push" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the pin and the carried patches
        id: line
        env:
          INPUT_PIN: ${{ inputs.pin }}
        run: |
          set -o errexit -o nounset -o pipefail
          # The pin is the nearest upstream release tag reachable from the
          # branch, prereleases included. Only upstream's tags count: the
          # line's own tags (v2.3.0, …) version the package, not the software
          # (FORK.md, "Publishing"), and they share the v* namespace — a tag
          # reachable from HEAD is the pin only when upstream has it. Nearest
          # by commit distance, since a version sort orders a prerelease after
          # its release.
          upstream_tags=$(git ls-remote --tags --refs upstream 'refs/tags/v[0-9]*' | awk -F/ '{ print $NF }')
          # grep exits 1 when no reachable tag is upstream's; the run says so
          # instead of ending on a bare exit code.
          current=$(git tag --merged HEAD --list 'v[0-9]*' | grep -Fx -f <(printf '%s\n' "${upstream_tags}") |
            while read -r tag; do echo "$(git rev-list --count "${tag}..HEAD") ${tag}"; done | sort -n | awk 'NR == 1 { print $2 }') || true
          if [ -z "${current}" ]; then
            echo "::error::no release tag of ${UPSTREAM_REPO} is reachable from ${LINE_BRANCH}: the line's pin is not an upstream tag (FORK.md, \"Pin\")"
            exit 1
          fi
          new="${INPUT_PIN:-${current}}"
          if ! git rev-parse --verify --quiet "${new}^{commit}" >/dev/null; then
            echo "::error::pin '${new}' is not a known upstream tag or commit"
            exit 1
          fi
          {
            echo "current=${current}"
            echo "new=${new}"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "- pin: \`${current}\` → \`${new}\`"
            echo "- carried patches on \`${LINE_BRANCH}\`:"
            git log --reverse --format='  - `%h` %s' "${current}..HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the rebase onto upstream main
        if: inputs.pin == ''
        env:
          CURRENT: ${{ steps.line.outputs.current }}
          HEAD_SHA: ${{ steps.line.outputs.head }}
        run: |
          set -o errexit -o nounset -o pipefail
          up=$(git rev-parse --short upstream/main)
          if git rebase --quiet --onto upstream/main "${CURRENT}" >/dev/null 2>&1; then
            echo "- probe: the carried patches rebase cleanly onto upstream main \`${up}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            conflict=$(git rev-parse --short REBASE_HEAD 2>/dev/null || echo unknown)
            git rebase --abort
            subject=$(git log -1 --format=%s "${conflict}" 2>/dev/null || true)
            echo "- probe: rebasing onto upstream main \`${up}\` conflicts at \`${conflict}\` ${subject}" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::carried patch ${conflict} (${subject}) conflicts with upstream main; the next re-pin needs a hand"
          fi
          git checkout --quiet "${HEAD_SHA}"

      - name: Re-pin
        id: repin
        # A pin equal to the current one rebuilds the candidate on the same
        # pin: the replay is a no-op and there is nothing to land.
        if: inputs.pin != ''
        env:
          CURRENT: ${{ steps.line.outputs.current }}
          NEW: ${{ steps.line.outputs.new }}
          HEAD_SHA: ${{ steps.line.outputs.head }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          branch="sync/$(date -u +%Y%m%d)-${NEW}"
          land="Actions → sync-upstream → Run workflow with \`land\` = \`${branch}\`"
          if git rebase --onto "${NEW}" "${CURRENT}"; then
            echo "- re-pin: the carried patches rebased onto \`${NEW}\`" >> "$GITHUB_STEP_SUMMARY"
            git log --reverse --format='  - `%h` %s' "${NEW}..HEAD" >> "$GITHUB_STEP_SUMMARY"
            # A smoke, not the suite: the Rust build takes the better part of an
            # hour and runs on the candidate's push (pull_request.yml).
            go build ./...
            if [ "$(git rev-parse HEAD)" = "${HEAD_SHA}" ]; then
              echo "- candidate: the replay onto \`${NEW}\` is \`${LINE_BRANCH}\` itself (\`${HEAD_SHA:0:12}\`); nothing to land" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            title="sync: re-pin ${LINE_BRANCH} onto ${NEW}"
            {
              echo "Re-pin candidate of \`${LINE_BRANCH}\` from \`${CURRENT}\` onto \`${NEW}\`: the carried patches replayed, \`go build ./...\` passed."
              echo
              git log --reverse --format='- `%h` %s' "${NEW}..HEAD"
              echo
              echo "The push of this branch runs the line's required checks (${REQUIRED_CHECKS}) on its head. Review the candidate here; once they are green, land it with ${land}, which pushes exactly this head to \`${LINE_BRANCH}\` and closes this pull request. Do not merge it: the line is a rebased branch, a merge would fold the old pin back in (FORK.md, \"Re-pin\")."
              echo
              echo "Line head: ${HEAD_SHA}"
            } > "${RUNNER_TEMP}/body.md"
            failed=false
          else
            # A carried patch conflicts: the candidate holds the patches before
            # it, and the pull request names the rest.
            conflict=$(git rev-parse REBASE_HEAD)
            git rebase --abort
            git checkout --quiet --detach "${conflict}^"
            git rebase --quiet --onto "${NEW}" "${CURRENT}"
            title="sync: re-pin ${LINE_BRANCH} onto ${NEW} (hand-over: a carried patch conflicts)"
            {
              echo "Re-pin of \`${LINE_BRANCH}\` from \`${CURRENT}\` onto \`${NEW}\` stopped at a conflicting carried patch."
              echo
              echo "Replayed on this branch:"
              git log --reverse --format='- `%h` %s' "${NEW}..HEAD"
              echo
              echo "Conflicting: \`$(git rev-parse --short "${conflict}")\` $(git log -1 --format=%s "${conflict}")"
              echo
              echo "Not replayed yet (in order):"
              git log --reverse --format='- `%h` %s' "${conflict}^..${HEAD_SHA}"
              echo
              echo "To finish (FORK.md, \"Re-pin\"): check this branch out, \`git cherry-pick -x\` the conflicting patch and the ones behind it, resolve, run \`go build ./... && make lint\` and push this branch, which runs the line's required checks (${REQUIRED_CHECKS}) on its head. Once they are green, land it with ${land}. Do not merge it: the line is a rebased branch, a merge would fold the old pin back in."
              echo
              echo "Line head: ${HEAD_SHA}"
            } > "${RUNNER_TEMP}/body.md"
            echo "- re-pin: conflict at \`$(git rev-parse --short "${conflict}")\` $(git log -1 --format=%s "${conflict}")" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::carried patch $(git rev-parse --short "${conflict}") conflicts with ${NEW}; hand-over candidate ${branch}"
            failed=true
          fi
          {
            echo "- candidate \`${branch}\` at \`$(git rev-parse --short HEAD)\`, pull request against \`${LINE_BRANCH}\`: ${title}"
            echo
            echo '<details><summary>pull request body</summary>'
            echo
            cat "${RUNNER_TEMP}/body.md"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          url=""
          if [ "${DRY_RUN}" != true ]; then
            git push --force origin "HEAD:refs/heads/${branch}"
            url=$(gh pr create --repo "${GITHUB_REPOSITORY}" --base "${LINE_BRANCH}" --head "${branch}" \
              --title "${title}" --body-file "${RUNNER_TEMP}/body.md")
            echo "${url}" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "branch=${branch}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"
          [ "${failed}" = false ]

      - name: Prune the candidates the new one supersedes
        # A candidate that conflicted still supersedes the older ones: it is
        # the one to finish.
        if: always() && steps.repin.outputs.branch != ''
        env:
          BRANCH: ${{ steps.repin.outputs.branch }}
          URL: ${{ steps.repin.outputs.url }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          for candidate in $(git ls-remote --heads origin 'refs/heads/sync/*' | sed 's|.*refs/heads/||'); do
            [ "${candidate}" != "${BRANCH}" ] || continue
            open=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${candidate}" --state open --json number)
            prs=$(jq -r '.[].number' <<<"${open}")
            closes=$(jq -r 'map(", close #\(.number)") | join("")' <<<"${open}")
            echo "- superseded \`${candidate}\`: delete${closes}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${DRY_RUN}" != true ]; then
              for number in ${prs}; do
                gh pr close "${number}" --repo "${GITHUB_REPOSITORY}" --comment "Superseded by the re-pin candidate \`${BRANCH}\` (${URL})."
              done
              git push origin --delete "${candidate}"
            fi
          done

  land:
    if: inputs.land != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Mint the bot token
        id: app
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.HERALD_CLIENT_ID }}
          private-key: ${{ secrets.HERALD_APP_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.LINE_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Land the candidate
        # The candidate lands as the commit its required checks ran on, onto
        # the line head it was replayed from; the line's ruleset refuses a push
        # whose head has not passed them.
        env:
          CANDIDATE: ${{ inputs.land }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          case "${CANDIDATE}" in
            sync/*) ;;
            *) echo "::error::${CANDIDATE} is not a re-pin candidate (sync/<date>-<pin>)"; exit 1 ;;
          esac
          pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${CANDIDATE}" --base "${LINE_BRANCH}" --state open --json number,headRefOid,body --jq '.[0] // empty')
          if [ -z "${pr}" ]; then
            echo "::error::no open pull request of ${CANDIDATE} against ${LINE_BRANCH}"
            exit 1
          fi
          number=$(jq -r .number <<<"${pr}")
          sha=$(jq -r .headRefOid <<<"${pr}")
          base=$(jq -r .body <<<"${pr}" | sed -n 's/^Line head: \([0-9a-f]\{40\}\)$/\1/p' | tail -1)
          line=$(git rev-parse HEAD)
          if [ "${base}" != "${line}" ]; then
            echo "::error::${LINE_BRANCH} is at ${line}, the candidate was replayed from ${base:-an unrecorded head}: build a new candidate"
            exit 1
          fi
          for check in ${REQUIRED_CHECKS}; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=${check}&filter=latest" --jq '[.check_runs[].conclusion] | if length == 0 then "missing" elif all(. == "success") then "success" else map(. // "pending") | join(",") end')
            echo "- \`${check}\` on \`${sha:0:12}\`: ${conclusion}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${conclusion}" != success ]; then
              echo "::error::required check ${check} on ${sha} is ${conclusion}"
              exit 1
            fi
          done
          git fetch --quiet origin "${sha}"
          echo "- land #${number}: \`${LINE_BRANCH}\` \`${line:0:12}\` → \`${sha:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_RUN}" != true ]; then
            git push --force-with-lease="refs/heads/${LINE_BRANCH}:${line}" origin "${sha}:refs/heads/${LINE_BRANCH}"
            # Once the line holds the candidate's head GitHub may mark the pull
            # request merged and delete its branch; neither is a failed land.
            landed="Landed: \`${LINE_BRANCH}\` is now \`${sha}\`, the head the required checks passed on."
            if ! gh pr close "${number}" --repo "${GITHUB_REPOSITORY}" --comment "${landed}"; then
              [ "$(gh pr view "${number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" != OPEN ] || exit 1
              gh pr comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${landed}"
            fi
            if git ls-remote --exit-code --heads origin "${CANDIDATE}" >/dev/null; then
              git push origin --delete "${CANDIDATE}"
            fi
          fi
