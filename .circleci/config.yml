# Fork (giantswarm/agentgateway-upstream): the line's publishing pipeline.
# Every push to `giantswarm` publishes a dev build and every release tag
# (`vX.Y.Z`, or `vX.Y.Z-rc.N` for a release candidate) a release of the two
# images the platform runs — the data-plane proxy (upstream's root Dockerfile)
# and the controller (.circleci/Dockerfile.controller) — under the line's own
# path in the org's registries, gsoci.azurecr.io first:
#
#   gsoci.azurecr.io/giantswarm/agentgateway-upstream/agentgateway:<version>
#   gsoci.azurecr.io/giantswarm/agentgateway-upstream/controller:<version>
#
# The architect orb's stock jobs do all of it. `push-to-registries` takes the
# version from gitsemver — a release tag `vX.Y.Z` gives the image tag `X.Y.Z`,
# a branch commit gitsemver's dev version — builds linux/amd64 and linux/arm64,
# pushes, signs and attests (SLSA provenance, SPDX SBOM) with the org's CircleCI
# identity. The data plane's platforms are built natively on a machine of each
# architecture (`build-image`) and joined into one index; the controller is one
# multi-platform build of a Dockerfile that cross-compiles. Both images are
# scanned with Trivy after the push; releases reach the China mirror through
# `sync-china-registry`. Nothing is published from GitHub Actions or by hand.
# FORK.md, "Publishing".
#
# Every other branch runs the same builds with `push: false` (the `validate`
# workflow): the Dockerfiles and the build arguments are proven on the pull
# request, nothing is pushed.
version: 2.1

orbs:
  architect: giantswarm/architect@10.6.3

# The upstream commit the line is pinned to (FORK.md, "Pin"), stamped on every
# published index so a consumer can read which agentgateway it runs without
# this repository at hand. Updated at every re-pin (FORK.md, "Re-pin").
upstream_annotation: &upstream_annotation |
  index:io.giantswarm.upstream.version=main@08f4563b

# Upstream's Dockerfile refuses to build without VERSION and GIT_REVISION
# (`agentgateway --version` must not report "unknown"); DOCKER_IMAGE_TAG is the
# version the orb computed for this pipeline.
agentgateway_build_args: &agentgateway_build_args |
  VERSION=${DOCKER_IMAGE_TAG}
  GIT_REVISION=${CIRCLE_SHA1}

controller_build_args: &controller_build_args |
  VERSION=${DOCKER_IMAGE_TAG}

publish_filters: &publish_filters
  branches:
    only: giantswarm
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/

release_filters: &release_filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/

validate_filters: &validate_filters
  branches:
    ignore: giantswarm

jobs:
  # Both published images are scanned after the push; a fixable HIGH or
  # CRITICAL finding fails the pipeline (a red release is not consumed — fix
  # the dependency, upstream first, or time-box it in .trivyignore with an
  # expiry when upstream has no fix). The images are public, no login needed.
  # Trivy runs as a container on the remote Docker host, which a bind mount of
  # the checkout does not reach, so .trivyignore is copied into the container.
  scan:
    parameters:
      image:
        type: string
    executor: architect/architect
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker:
          version: default
      - run:
          name: Scan << parameters.image >>
          command: |
            set -o errexit -o nounset -o pipefail
            test -s .build_version
            ref="gsoci.azurecr.io/<< parameters.image >>:$(cat .build_version)"
            echo "scanning ${ref}"
            container="$(docker create \
              --env TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
              gsoci.azurecr.io/giantswarm/trivy:0.74.0 \
              image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile /.trivyignore \
              --exit-code 1 --format table "${ref}")"
            docker cp .trivyignore "${container}:/.trivyignore"
            docker start --attach "${container}"

workflows:
  publish:
    jobs:
      # The data plane: the Rust build is the whole critical path, so each
      # platform is built natively on a machine of its architecture and the
      # push job joins the two digests into one signed index.
      - architect/build-image:
          context: architect
          name: build-image-agentgateway-amd64
          image: giantswarm/agentgateway-upstream/agentgateway
          platform: linux/amd64
          resource_class: xlarge
          build-args: *agentgateway_build_args
          split-china-push: true
          filters: *publish_filters
      - architect/build-image:
          context: architect
          name: build-image-agentgateway-arm64
          image: giantswarm/agentgateway-upstream/agentgateway
          platform: linux/arm64
          resource_class: arm.xlarge
          build-args: *agentgateway_build_args
          split-china-push: true
          filters: *publish_filters
      - architect/push-to-registries:
          context: architect
          name: push-to-registries-agentgateway
          image: giantswarm/agentgateway-upstream/agentgateway
          merge-digests: true
          platforms: linux/amd64,linux/arm64
          split-china-push: true
          annotations: *upstream_annotation
          requires:
            - build-image-agentgateway-amd64
            - build-image-agentgateway-arm64
          filters: *publish_filters

      # The controller: the Dockerfile cross-compiles the Go binary on the
      # build host and copies it onto chainguard/static, so one multi-platform
      # build is native in effect. The agentgateway push job is the one that
      # persists .build_version for the jobs downstream.
      - architect/push-to-registries:
          context: architect
          name: push-to-registries-controller
          image: giantswarm/agentgateway-upstream/controller
          dockerfile: .circleci/Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          build-args: *controller_build_args
          persist-build-version: false
          split-china-push: true
          annotations: *upstream_annotation
          filters: *publish_filters

      - scan:
          name: scan-agentgateway
          image: giantswarm/agentgateway-upstream/agentgateway
          requires:
            - push-to-registries-agentgateway
          filters: *publish_filters
      - scan:
          name: scan-controller
          image: giantswarm/agentgateway-upstream/controller
          requires:
            - push-to-registries-controller
            # for .build_version — only the agentgateway push job persists it
            - push-to-registries-agentgateway
          filters: *publish_filters

      # Releases reach the China mirror through the org's self-hosted runner
      # there (split-china-push above keeps Aliyun out of the direct push set);
      # dev builds stay on gsoci.
      - architect/sync-china-registry:
          context: architect
          name: sync-china-registry-agentgateway
          image: giantswarm/agentgateway-upstream/agentgateway
          requires:
            - push-to-registries-agentgateway
          filters: *release_filters
      - architect/sync-china-registry:
          context: architect
          name: sync-china-registry-controller
          image: giantswarm/agentgateway-upstream/controller
          requires:
            - push-to-registries-controller
          filters: *release_filters

  # Pull-request branches: the same builds, nothing pushed. No credentials are
  # used, so the jobs run without the context.
  validate:
    jobs:
      - architect/build-image:
          name: validate-agentgateway-amd64
          image: giantswarm/agentgateway-upstream/agentgateway
          platform: linux/amd64
          resource_class: xlarge
          build-args: *agentgateway_build_args
          push: false
          filters: *validate_filters
      - architect/build-image:
          name: validate-agentgateway-arm64
          image: giantswarm/agentgateway-upstream/agentgateway
          platform: linux/arm64
          resource_class: arm.xlarge
          build-args: *agentgateway_build_args
          push: false
          filters: *validate_filters
      - architect/push-to-registries:
          name: validate-controller
          image: giantswarm/agentgateway-upstream/controller
          dockerfile: .circleci/Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          build-args: *controller_build_args
          push: false
          filters: *validate_filters
