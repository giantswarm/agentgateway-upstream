apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-service-only-match
  namespace: default
spec:
  parentRefs:
  - name: test-gateway
  hostnames:
  - grpc.example.com
  rules:
  # Every method of the service: a prefix over /example.Service/<method>, not an exact path.
  - matches:
    - method:
        service: example.Service
    backendRefs:
    - name: infra-backend-v1
      port: 8080
  # A method on any service: a regex with one segment for the service.
  - matches:
    - method:
        method: GetUser
    backendRefs:
    - name: infra-backend-v2
      port: 8080

---
# Output
output:
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 8080
          service:
            hostname: infra-backend-v1.default.svc.cluster.local
            namespace: default
        weight: 1
      hostnames:
      - grpc.example.com
      key: default/grpc-service-only-match.00.grpc.http
      listenerKey: default/test-gateway.http
      matches:
      - path:
          pathPrefix: /example.Service/
      name:
        kind: GRPCRoute
        name: grpc-service-only-match
        namespace: default
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    route:
      backends:
      - backend:
          port: 8080
          service:
            hostname: infra-backend-v2.default.svc.cluster.local
            namespace: default
        weight: 1
      hostnames:
      - grpc.example.com
      key: default/grpc-service-only-match.01.grpc.http
      listenerKey: default/test-gateway.http
      matches:
      - path:
          regex: /[^/]+/GetUser
      name:
        kind: GRPCRoute
        name: grpc-service-only-match
        namespace: default
status:
- apiVersion: gateway.networking.k8s.io/v1
  kind: GRPCRoute
  metadata:
    name: grpc-service-only-match
    namespace: default
  spec: null
  status:
    parents:
    - conditions:
      - lastTransitionTime: fake
        message: ""
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: ""
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      controllerName: agentgateway.dev/agentgateway
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
